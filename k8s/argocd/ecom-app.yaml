apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-app
  namespace: argocd
spec:
  project: default
  source:
    chart: ecom-app-chart
    repoURL: https://github.com/tuannamnguyen/k8s-resume-challenge-infra.git
    targetRevision: HEAD
    path: ecom-app-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: ecom-app
