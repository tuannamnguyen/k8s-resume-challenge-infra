nameOverride: ""
fullnameOverride: ""
replicaCount: 3

image:
  repository: tuannamnguyen290602/ecom-web
  tag: v7
  pullPolicy: IfNotPresent

config:
  heroHeading: "test env once again lmao"

service:
  type: ClusterIP
  port: 9000
  targetPort: 8000

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 30

resources:
  requests:
    memory: 128Mi
    cpu: 500m
  limits:
    memory: 128Mi

# Keep secret material out of Git and Helm release metadata by default.
secret:
  create: true
  existingSecret: ecom-app-secret
  envProd: "abcd"
  dotenvxPrivateKey: "abvc"
