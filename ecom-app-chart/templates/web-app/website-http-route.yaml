{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ecom-app.fullname" . }}
  labels:
    {{- include "ecom-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ required "route.gatewayName is required when route.enabled is true" .Values.route.gatewayName }}
      namespace: {{ required "route.gatewayNamespace is required when route.enabled is true" .Values.route.gatewayNamespace }}
      sectionName: {{ .Values.route.sectionName }}
  hostnames:
    - {{ required "route.hostname is required when route.enabled is true" .Values.route.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "ecom-app.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
