apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tuannamnguyen/k8s-resume-challenge-infra.git
    targetRevision: HEAD
    path: ecom-app-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ecom-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
