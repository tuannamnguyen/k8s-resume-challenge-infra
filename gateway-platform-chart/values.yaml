gatewayClass:
  create: true
  name: aws-alb-gateway-class
  controllerName: gateway.k8s.aws/alb

gateway:
  create: true
  name: cluster-gateway
  namespace: gateway
  hostname: "*.tunebridge.online"
  tlsSecretName: ""

lbConfiguration:
  name: cluster-gw-lbconfig
  defaultCertificate: "" # patch later with ACM cert ARN from terraform output
  scheme: internet-facing

argocdRoute:
  enabled: true
  namespace: argocd
  hostname: "argocd.tunebridge.online"
  sectionName: https
  serviceName: argocd-server
  servicePort: 80

ecomAppRoute:
  enabled: true
  namespace: ecom-app
  sectionName: https
  hostname: "app.tunebridge.online"
  serviceName: ecom-app
  servicePort: 80

targetGroupConfiguration:
  enabled: true
  name: argocd-server
  # A TargetGroupConfiguration must be in the same namespace as its referenced Service.
  namespace: argocd
  targetReference:
    name: argocd-server
    kind: Service
  defaultConfiguration:
    targetGroupName: argocd-server
    targetType: ip
