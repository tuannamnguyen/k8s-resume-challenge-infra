{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "gateway-platform.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.create is true" .Values.gateway.className }}
  listeners:
    - protocol: HTTPS
      port: 443
      name: https
      hostname: {{ required "gateway.hostname is required when gateway.create is true" .Values.gateway.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ required "gateway.tlsSecretName is required when gateway.create is true" .Values.gateway.tlsSecretName }}
            kind: Secret
            group: ""
{{- end }}
