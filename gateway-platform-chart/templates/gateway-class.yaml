{{- if .Values.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ required "gatewayClass.name is required when gatewayClass.create is true" .Values.gatewayClass.name }}
  labels:
    {{- include "gateway-platform.labels" . | nindent 4 }}
spec:
  controllerName: {{ required "gatewayClass.controllerName is required when gatewayClass.create is true" .Values.gatewayClass.controllerName }}
{{- end }}
